<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>منوی دیجیتال رستوران</title>

<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">

<style>
:root{
    --gold:#d4af37;
    --dark:#080808;
    --card:#151515;
    --card2:rgba(20,20,20,0.88);
    --text:#fff;
    --muted:#aaa;
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Vazirmatn, sans-serif;
    background:var(--dark);
    color:var(--text);
    overflow:hidden;
}

/* پس‌زمینه */
.bg{
    position:fixed;
    inset:0;
    background:
        linear-gradient(rgba(0,0,0,0.65), rgba(0,0,0,0.85)),
        url("https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?auto=format&fit=crop&w=1800&q=80");
    background-size:cover;
    background-position:center;
    z-index:-2;
}

.bg::after{
    content:"";
    position:absolute;
    inset:0;
    background:radial-gradient(circle at center, transparent 0%, #000 90%);
}

/* صفحه اصلی */
#screen{
    width:100vw;
    height:100vh;
    display:flex;
    flex-direction:column;
    position:relative;
}

.header{
    height:145px;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    position:relative;
}

.logo{
    font-size:48px;
    font-weight:900;
    color:var(--gold);
    letter-spacing:4px;
}

.subtitle{
    color:#ccc;
    margin-top:8px;
    font-size:17px;
}

/* دکمه ادمین */
.admin-toggle{
    position:absolute;
    top:25px;
    left:25px;
    background:rgba(212,175,55,0.95);
    color:#000;
    border:none;
    padding:10px 18px;
    border-radius:8px;
    cursor:pointer;
    font-family:inherit;
    font-weight:800;
    z-index:20;
}

.admin-toggle:hover{
    background:#f1cc5a;
}

/* پیشنهاد ویژه */
.special{
    position:absolute;
    top:25px;
    right:25px;
    background:linear-gradient(135deg,#d4af37,#f7dd7c);
    color:#000;
    padding:12px 20px;
    border-radius:12px;
    font-weight:900;
    box-shadow:0 0 25px rgba(212,175,55,0.45);
    animation:pulse 2s infinite;
    z-index:10;
}

@keyframes pulse{
    0%{transform:scale(1)}
    50%{transform:scale(1.06)}
    100%{transform:scale(1)}
}

/* اسلایدر */
.slider{
    flex:1;
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
}

.slide{
    position:absolute;
    width:92%;
    max-width:1380px;
    opacity:0;
    transform:translateY(50px) scale(0.98);
    pointer-events:none;
    transition:all 900ms ease;
}

.slide.active{
    opacity:1;
    transform:translateY(0) scale(1);
    pointer-events:auto;
}

.category-title{
    font-size:40px;
    text-align:center;
    color:var(--gold);
    margin-bottom:35px;
    font-weight:900;
}

.menu-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:24px;
}

.menu-item{
    display:grid;
    grid-template-columns:90px 1fr auto;
    align-items:center;
    gap:16px;
    background:var(--card2);
    border:1px solid rgba(255,255,255,0.08);
    padding:15px;
    border-radius:16px;
    box-shadow:0 15px 40px rgba(0,0,0,0.35);
    backdrop-filter:blur(6px);
    animation:itemIn 700ms ease both;
}

.menu-item:nth-child(1){animation-delay:100ms}
.menu-item:nth-child(2){animation-delay:220ms}
.menu-item:nth-child(3){animation-delay:340ms}
.menu-item:nth-child(4){animation-delay:460ms}
.menu-item:nth-child(5){animation-delay:580ms}
.menu-item:nth-child(6){animation-delay:700ms}

@keyframes itemIn{
    from{
        opacity:0;
        transform:translateY(25px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

.food-img{
    width:90px;
    height:90px;
    object-fit:cover;
    border-radius:14px;
    border:1px solid rgba(212,175,55,0.35);
}

.item-title{
    font-size:22px;
    font-weight:900;
    margin-bottom:6px;
}

.item-desc{
    font-size:14px;
    color:#bbb;
    line-height:1.8;
}

.price{
    color:var(--gold);
    font-size:25px;
    font-weight:900;
    white-space:nowrap;
}

.footer{
    height:70px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#ccc;
    font-size:16px;
}

/* QR */
.qr-box{
    position:absolute;
    bottom:22px;
    left:22px;
    display:flex;
    align-items:center;
    gap:10px;
    background:rgba(0,0,0,0.65);
    padding:10px 14px;
    border-radius:12px;
    border:1px solid rgba(255,255,255,0.1);
    z-index:10;
}

.qr-box img{
    width:70px;
    height:70px;
    border-radius:8px;
    background:#fff;
    padding:4px;
}

.qr-text{
    color:#ddd;
    font-size:13px;
    line-height:1.8;
}

/* پنل مدیریت */
#adminPanel{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.92);
    z-index:100;
    display:none;
    overflow:auto;
    padding:30px;
}

#adminPanel.show{
    display:block;
}

.admin-box{
    max-width:1100px;
    margin:0 auto;
    background:#111;
    border:1px solid #333;
    border-radius:18px;
    padding:25px;
}

.admin-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    border-bottom:1px solid #333;
    padding-bottom:18px;
    margin-bottom:20px;
}

.admin-title{
    color:var(--gold);
    font-size:26px;
    font-weight:900;
}

.admin-actions{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
}

.btn{
    font-family:inherit;
    border:none;
    border-radius:8px;
    padding:10px 16px;
    cursor:pointer;
    font-weight:800;
}

.btn-save{
    background:#2ecc71;
    color:#000;
}

.btn-close{
    background:#444;
    color:#fff;
}

.btn-reset{
    background:#e74c3c;
    color:#fff;
}

.btn-add{
    background:var(--gold);
    color:#000;
}

.admin-category{
    margin:25px 0;
    padding:18px;
    border:1px solid #292929;
    border-radius:14px;
    background:#181818;
}

.admin-category h3{
    color:var(--gold);
    margin-top:0;
}

.form-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

.admin-item{
    background:#0e0e0e;
    border:1px solid #333;
    border-radius:12px;
    padding:14px;
    margin-bottom:14px;
}

.admin-item label{
    display:block;
    font-size:13px;
    color:#aaa;
    margin-bottom:6px;
}

.admin-item input,
.admin-item textarea{
    width:100%;
    padding:10px;
    border-radius:8px;
    border:1px solid #333;
    background:#050505;
    color:#fff;
    font-family:inherit;
}

.admin-item textarea{
    resize:vertical;
    min-height:70px;
}

.remove-btn{
    background:#7f1d1d;
    color:#fff;
    margin-top:10px;
}

/* ریسپانسیو */
@media(max-width:900px){
    .menu-grid{
        grid-template-columns:1fr;
    }

    .logo{
        font-size:34px;
    }

    .category-title{
        font-size:30px;
    }

    .menu-item{
        grid-template-columns:70px 1fr auto;
    }

    .food-img{
        width:70px;
        height:70px;
    }

    .item-title{
        font-size:18px;
    }

    .price{
        font-size:20px;
    }

    .form-grid{
        grid-template-columns:1fr;
    }

    .qr-box{
        display:none;
    }
}
</style>
</head>

let menuData = loadData();

let currentSlide = 0;
let slideTimer = null;

/* ============================
   بارگذاری و ذخیره اطلاعات
============================ */

function loadData(){
    const saved = localStorage.getItem("restaurantMenuData");

    if(saved){
        try{
            return JSON.parse(saved);
        }catch(e){
            return structuredClone(defaultData);
        }
    }

    return structuredClone(defaultData);
}

function saveData(){
    localStorage.setItem("restaurantMenuData", JSON.stringify(menuData));
}

/* ============================
   رندر منوی اصلی
============================ */
let secretClicks = 0;
let clickTimer = null;

document.getElementById("restaurantName").addEventListener("click", () => {

    secretClicks++;

    clearTimeout(clickTimer);

    clickTimer = setTimeout(()=>{
        secretClicks = 0;
    },1500);

    if(secretClicks >= 5){
        secretClicks = 0;
        openAdmin();
    }

});


function renderMenu(){
    document.getElementById("restaurantName").textContent = menuData.restaurantName;
    document.getElementById("specialBox").textContent = menuData.specialText;

    const slider = document.getElementById("slider");
    slider.innerHTML = "";

    const itemsPerSlide = 4; // تعداد آیتم در هر اسلاید

    menuData.categories.forEach((category) => {
        const items = category.items || [];

        for(let i = 0; i < items.length; i += itemsPerSlide){
            const chunk = items.slice(i, i + itemsPerSlide);

            const slide = document.createElement("div");

            if(slider.children.length === 0){
                slide.className = "slide active";
            }else{
                slide.className = "slide";
            }

            const pageCount = Math.ceil(items.length / itemsPerSlide);
            const pageNumber = Math.floor(i / itemsPerSlide) + 1;
            const pageLabel = pageCount > 1 ? ` (${pageNumber}/${pageCount})` : "";

            slide.innerHTML = `
                <div class="category-title">${escapeHtml(category.title)}${pageLabel}</div>
                <div class="menu-grid">
                    ${chunk.map(item => `
                        <div class="menu-item">
                            <img class="food-img"
                                 src="${escapeAttr(item.image)}"
                                 onerror="this.src='https://images.unsplash.com/photo-1504674900247-0877df9cc836?auto=format&fit=crop&w=400&q=80'">
                            <div>
                                <div class="item-title">${escapeHtml(item.name)}</div>
                                <div class="item-desc">${escapeHtml(item.desc)}</div>
                            </div>
                            <div class="price">${escapeHtml(item.price)}</div>
                        </div>
                    `).join("")}
                </div>
            `;

            slider.appendChild(slide);
        }
    });

    currentSlide = 0;
    startSlider();
    generateQR();
}


function startSlider(){
    clearInterval(slideTimer);

    const slides = document.querySelectorAll(".slide");

    if(slides.length <= 1) return;

    slideTimer = setInterval(() => {
        slides[currentSlide].classList.remove("active");

        currentSlide++;

        if(currentSlide >= slides.length){
            currentSlide = 0;
        }

        slides[currentSlide].classList.add("active");
    }, 8000);
}

/* ============================
   QR Code
============================ */

function generateQR(){
    const currentUrl = window.location.href;
    const qrUrl = "https://api.qrserver.com/v1/create-qr-code/?size=160x160&data=" + encodeURIComponent(currentUrl);
    document.getElementById("qrImage").src = qrUrl;
}

/* ============================
   پنل مدیریت
============================ */

function openAdmin(){

    const pass = prompt("رمز مدیریت را وارد کنید");

    if(pass !== ADMIN_PASSWORD){
        alert("رمز اشتباه است");
        return;
    }

    document.getElementById("adminPanel").classList.add("show");
    renderAdmin();
}


function closeAdmin(){
    document.getElementById("adminPanel").classList.remove("show");
}

function renderAdmin(){
    document.getElementById("adminRestaurantName").value = menuData.restaurantName;
    document.getElementById("adminSpecialText").value = menuData.specialText;

    const adminContent = document.getElementById("adminContent");
    adminContent.innerHTML = "";

    menuData.categories.forEach((category, categoryIndex) => {
        const categoryBox = document.createElement("div");
        categoryBox.className = "admin-category";

        categoryBox.innerHTML = `
            <h3>دسته ${categoryIndex + 1}</h3>

            <div style="margin-bottom:15px;">
                <label style="display:block;color:#aaa;margin-bottom:6px;">نام دسته</label>
                <input 
                    data-type="category-title" 
                    data-category="${categoryIndex}" 
                    value="${escapeAttr(category.title)}"
                    style="width:100%;padding:12px;border-radius:8px;border:1px solid #333;background:#050505;color:#fff;font-family:inherit;"
                >
            </div>

            <div id="categoryItems-${categoryIndex}"></div>

            <button class="btn btn-add" onclick="addItem(${categoryIndex})">افزودن آیتم به این دسته</button>
            <button class="btn btn-reset" onclick="removeCategory(${categoryIndex})">حذف این دسته</button>
        `;

        adminContent.appendChild(categoryBox);

        const itemsContainer = categoryBox.querySelector(`#categoryItems-${categoryIndex}`);

        category.items.forEach((item, itemIndex) => {
            const itemBox = document.createElement("div");
            itemBox.className = "admin-item";

            itemBox.innerHTML = `
                <div class="form-grid">
                    <div>
                        <label>نام غذا</label>
                        <input data-type="item-name" data-category="${categoryIndex}" data-item="${itemIndex}" value="${escapeAttr(item.name)}">
                    </div>

                    <div>
                        <label>قیمت</label>
                        <input data-type="item-price" data-category="${categoryIndex}" data-item="${itemIndex}" value="${escapeAttr(item.price)}">
                    </div>

                    <div>
                        <label>لینک تصویر</label>
                        <input data-type="item-image" data-category="${categoryIndex}" data-item="${itemIndex}" value="${escapeAttr(item.image)}">
                    </div>

                    <div>
                        <label>توضیحات</label>
                        <textarea data-type="item-desc" data-category="${categoryIndex}" data-item="${itemIndex}">${escapeHtml(item.desc)}</textarea>
                    </div>
                </div>

                <button class="btn remove-btn" onclick="removeItem(${categoryIndex}, ${itemIndex})">حذف آیتم</button>
            `;

            itemsContainer.appendChild(itemBox);
        });
    });
}

function saveAdmin(){
    menuData.restaurantName = document.getElementById("adminRestaurantName").value;
    menuData.specialText = document.getElementById("adminSpecialText").value;

    document.querySelectorAll("[data-type]").forEach(input => {
        const type = input.dataset.type;
        const categoryIndex = Number(input.dataset.category);
        const itemIndex = Number(input.dataset.item);

        if(type === "category-title"){
            menuData.categories[categoryIndex].title = input.value;
        }

        if(type === "item-name"){
            menuData.categories[categoryIndex].items[itemIndex].name = input.value;
        }

        if(type === "item-price"){
            menuData.categories[categoryIndex].items[itemIndex].price = input.value;
        }

        if(type === "item-desc"){
            menuData.categories[categoryIndex].items[itemIndex].desc = input.value;
        }

        if(type === "item-image"){
            menuData.categories[categoryIndex].items[itemIndex].image = input.value;
        }
    });

    saveData();
    renderMenu();

    alert("تغییرات ذخیره شد.");
}

function addCategory(){
    menuData.categories.push({
        title:"دسته جدید",
        items:[]
    });

    renderAdmin();
}

function removeCategory(categoryIndex){
    if(confirm("این دسته حذف شود؟")){
        menuData.categories.splice(categoryIndex, 1);
        renderAdmin();
    }
}

function addItem(categoryIndex){
    menuData.categories[categoryIndex].items.push({
        name:"آیتم جدید",
        price:"۰",
        desc:"توضیحات آیتم جدید",
        image:"https://images.unsplash.com/photo-1504674900247-0877df9cc836?auto=format&fit=crop&w=400&q=80"
    });

    renderAdmin();
}

function removeItem(categoryIndex, itemIndex){
    if(confirm("این آیتم حذف شود؟")){
        menuData.categories[categoryIndex].items.splice(itemIndex, 1);
        renderAdmin();
    }
}

function resetData(){
    if(confirm("همه تغییرات حذف و منو به حالت اولیه برگردد؟")){
        localStorage.removeItem("restaurantMenuData");
        menuData = structuredClone(defaultData);
        renderAdmin();
        renderMenu();
    }
}

/* ============================
   ابزارهای امنیت متن
============================ */

function escapeHtml(text){
    return String(text)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}

function escapeAttr(text){
    return escapeHtml(text);
}

/* ============================
   اجرا
============================ */

renderMenu();

/* کلید میانبر برای باز و بسته کردن پنل مدیریت */
document.addEventListener("keydown", function(e){
    if(e.key === "Escape"){
        closeAdmin();
    }

    if(e.ctrlKey && e.key.toLowerCase() === "m"){
        openAdmin();
    }
});
</script>
