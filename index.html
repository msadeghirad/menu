<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>منوی دیجیتال رستوران</title>

<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
<link rel="stylesheet" href="style.css">


</head>

<body>

<div class="bg"></div>


<div id="screen">

    <div class="special" id="specialBox">
        پیشنهاد ویژه امروز
    </div>

    <div class="header">
        <div class="logo" id="restaurantName" style="cursor:pointer">ROODAN IAU RESTURANT</div>
        <div class="subtitle">منوی رستوران</div>
    </div>

    <div class="slider" id="slider"></div>

    <div class="footer">
        برای سفارش با صندوق هماهنگ فرمایید
    </div>

    <div class="qr-box">
        <img id="qrImage" alt="QR Code">
        <div class="qr-text">
            مشاهده منو<br>
            روی موبایل
        </div>
    </div>

</div>

<!-- پنل مدیریت -->
<div id="adminPanel">
    <div class="admin-box">
        <div class="admin-header">
            <div class="admin-title">پنل مدیریت منو</div>
            <div class="admin-actions">
                <button class="btn btn-add" onclick="addCategory()">افزودن دسته</button>
                <button class="btn btn-save" onclick="saveAdmin()">ذخیره تغییرات</button>
                <button class="btn btn-reset" onclick="resetData()">بازگشت به پیش‌فرض</button>
                <button class="btn btn-close" onclick="closeAdmin()">بستن</button>
            </div>
        </div>

        <div style="margin-bottom:20px;">
            <label style="display:block;color:#aaa;margin-bottom:6px;">نام رستوران</label>
            <input id="adminRestaurantName" style="width:100%;padding:12px;border-radius:8px;border:1px solid #333;background:#050505;color:#fff;font-family:inherit;">
        </div>

        <div style="margin-bottom:20px;">
            <label style="display:block;color:#aaa;margin-bottom:6px;">متن پیشنهاد ویژه</label>
            <input id="adminSpecialText" style="width:100%;padding:12px;border-radius:8px;border:1px solid #333;background:#050505;color:#fff;font-family:inherit;">
        </div>

        <div id="adminContent"></div>
    </div>
</div>

<script src="script.js"></script>

</body>
</html>
